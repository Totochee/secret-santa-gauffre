<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#285844">
  <title>Secret Santa – Famille GAUFFRE</title>
  <meta name="description" content="Le Secret Santa à distance de la famille GAUFFRE.">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#f4f0e7;color:#272925;font-family:Arial,Helvetica,sans-serif}
    main{width:min(560px,100%);padding:42px 28px;border:1px solid #dcd6ca;border-radius:14px;background:#fffefa;text-align:center;box-shadow:0 4px 0 #e1dbcf}
    .logo{width:48px;height:48px;display:grid;place-items:center;margin:0 auto 20px;border-radius:9px;background:#c84a3b;color:white;font-size:22px;font-weight:800}
    .label{margin:0;color:#c84a3b;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    h1{margin:9px 0 13px;font-size:clamp(32px,8vw,50px);line-height:1.04;letter-spacing:-.04em}
    p{margin:0 auto;color:#6e716b;line-height:1.55}
    a{display:inline-flex;margin-top:24px;padding:13px 18px;border-radius:8px;background:#285844;color:white;font-weight:800;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <div class="logo">G</div>
    <p class="label">Famille Gauffre</p>
    <h1>Ouverture du Secret Santa…</h1>
    <p>La version partagée permet à chacun d’utiliser son téléphone et de voir qui a déjà consulté son tirage.</p>
    <a id="open" href="https://secret-santa-gauffre.bestiontheo.chatgpt.site">Ouvrir le tirage</a>
  </main>
  <script>
    const target = "https://secret-santa-gauffre.bestiontheo.chatgpt.site/" + window.location.hash;
    document.getElementById("open").href = target;
    window.setTimeout(() => window.location.replace(target), 350);
  </script>
</body>
</html>
